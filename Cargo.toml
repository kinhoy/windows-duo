[package]
name = "windows-duo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "WindowsDuo"
path = "src/main.rs"

[dependencies]
winit = "0.30"
wgpu = "23"
egui = "0.30"
egui-wgpu = "0.30"
egui-winit = "0.30"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true