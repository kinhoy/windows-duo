name: Build Windows Release

on:
  push:
    tags:
      - 'v*'          # 推送 v1.0.0 这类 tag 时触发 Release
  workflow_dispatch:   # 也允许在 Actions 页面手动触发

permissions:
  contents: write      # softprops/action-gh-release 需要写权限

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsDuo-windows-x64
          path: target/x86_64-pc-windows-msvc/release/WindowsDuo.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/x86_64-pc-windows-msvc/release/WindowsDuo.exe
          generate_release_notes: true
          draft: false